name: CI

on:
  push:
    branches: [main, feature/vendor-neutral-wled-drm-first]
    tags: ["v*"]
  pull_request:
    branches: [main, feature/vendor-neutral-wled-drm-first]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Rust fmt / tests / Clippy / dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install native host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev cmake perl clang \
            python3 nodejs file binutils git
      - name: Install stable Rust with formatter and linter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.146
          fallback: none
      - name: Print toolchain versions
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version
          cargo nextest --version
          node --version
      - name: Verify release metadata
        run: python3 scripts/check_release.py
      - name: Enforce rustfmt
        run: cargo fmt --all -- --check
      - name: Run locked Rust test suite
        run: cargo nextest run --locked
      - name: Run Rust documentation tests
        run: cargo test --locked --doc
      - name: Clippy (deny warnings)
        run: cargo clippy --locked --bin lg-hue-sync -- -D warnings
      - name: Validate embedded dashboard JavaScript
        run: perl -0777 -ne 'print $1 if /<script>(.*)<\/script>/s' src/web/ui.html | node --check -
      - name: Ensure no generated file changes
        run: git diff --check

  webos-target:
    name: ARMv7 / webOS glibc 2.28 ABI
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install host tools required by the cross-build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make file binutils python3 ca-certificates
          command -v docker
          docker info
      - name: Build 32-bit ARMv7 binary using Debian Buster toolchain
        run: make build
      - name: Verify ARM ELF machine and required glibc versions
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/armv7-unknown-linux-gnueabi/release/lg-hue-sync
          test -s "$BIN"
          file "$BIN"
          file "$BIN" | grep -Eq 'ELF 32-bit.*ARM'
          readelf -h "$BIN"
          readelf -W --version-info "$BIN" > target/required-glibc.txt
          python3 - <<'PY'
          import pathlib
          import re
          text = pathlib.Path('target/required-glibc.txt').read_text()
          required = {tuple(map(int, version.split('.')))
                      for version in re.findall(r'GLIBC_([0-9]+\.[0-9]+(?:\.[0-9]+)?)', text)}
          if not required:
              raise SystemExit('FAIL: no GLIBC requirements found; inspect ELF ABI')
          too_new = sorted(v for v in required if v > (2, 28))
          print('GLIBC requirements:', sorted(required))
          if too_new:
              raise SystemExit('FAIL: requires GLIBC newer than 2.28: ' + str(too_new))
          print('PASS: ARMv7 ELF and GLIBC <= 2.28')
          PY
      - name: Stage release binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          cp target/armv7-unknown-linux-gnueabi/release/lg-hue-sync release/lg-hue-sync-armv7
          sha256sum release/lg-hue-sync-armv7 > release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: webos-armv7-release
          path: release/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, webos-target]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_release.py --tag "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v5
        with:
          name: webos-armv7-release
          path: release
      - name: Publish verified daemon release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes
